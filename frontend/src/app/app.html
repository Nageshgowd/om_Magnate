<header class="topbar">
  <a routerLink="/" class="brand" aria-label="Om-Magnet home">
    <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
      <rect width="48" height="48" rx="12" fill="#4f5ff0" />
      <path d="M16 15v11a8 8 0 0 0 16 0V15" fill="none" stroke="#fff" stroke-width="6" />
      <rect x="13" y="9" width="6" height="8" fill="#ff6f61" />
      <rect x="29" y="9" width="6" height="8" fill="#ff6f61" />
    </svg>
    <span class="name">Om<b>Magnet</b></span>
  </a>
  @if (auth.user()) {
    <span class="divider" aria-hidden="true"></span>
    <nav>
      <a routerLink="/" class="chip" [class.active]="onEvents()">
        <app-icon name="calendar" [size]="20" /> My Events
      </a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin/users" routerLinkActive="active" class="chip">Users</a>
      }
    </nav>
  }
  @if (auth.user(); as u) {
    <div class="account">
      <button type="button" class="userchip" (click)="menu.set(!menu())" [attr.aria-expanded]="menu()" aria-haspopup="true">
        <span class="av">{{ initials(u.name) }}</span>
        <span class="uname">{{ u.name }}</span>
        <app-icon name="chevron" [size]="18" />
      </button>
      @if (menu()) {
        <div class="pop" role="menu">
          <div class="who">
            <b>{{ u.name }}</b>
            <span>{{ u.username }} · {{ u.role === 'admin' ? 'Administrator' : 'User' }}</span>
          </div>
          <a routerLink="/account" role="menuitem" (click)="menu.set(false)">My account</a>
          <button type="button" role="menuitem" (click)="auth.logout()">Sign out</button>
        </div>
      }
    </div>
  }
</header>
<main (click)="menu.set(false)">
  <router-outlet />
</main>
